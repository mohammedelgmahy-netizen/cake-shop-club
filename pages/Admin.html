<style>
:root{
  --bg:#170B14; --bg2:#211020; --surface:#2A1427; --surface2:#361A31; --line:rgba(255,255,255,.09);
  --text:#FFF1F7; --muted:#D3B3C6; --brand:#5EE0DB; --brand2:#EC5B9C; --gold:#F5C451;
  --ok:#34D399; --warn:#FBBF24; --bad:#F87171; --radius:18px;
  --shadow:0 20px 50px -20px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Cairo',system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.6;font-size:15px;
  background-image:radial-gradient(1200px 600px at 110% -10%,rgba(236,91,156,.25),transparent 60%),radial-gradient(900px 500px at -20% 10%,rgba(94,224,219,.16),transparent 60%);
  background-attachment:fixed}
[dir=ltr] body, body[dir=ltr]{font-family:'Inter','Cairo',system-ui,sans-serif}
a{color:var(--brand)}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 40px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Inter',sans-serif;font-weight:800;letter-spacing:.5px}
.logo .mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  background:transparent;overflow:hidden}
.logo .mark img{width:40px;height:40px;display:block}
.logo img{height:38px;border-radius:10px}
.hero-logo{background:transparent;padding:0;max-width:230px;margin:2px auto 18px}
.hero-logo.wide{max-width:300px;margin:6px auto 18px}
.hero-logo.sm{max-width:150px;margin-bottom:14px}
.hero-logo.wide.sm{max-width:240px}
.hero-logo img{display:block;width:100%;height:auto}
.logo small{display:block;font-size:10px;letter-spacing:5px;font-weight:700;margin-top:-2px;background:linear-gradient(90deg,#F5C542,#E0A526);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip-btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
h1{font-size:26px;line-height:1.3;margin:6px 0 4px;font-weight:800}
h2{font-size:18px;margin:0 0 10px;font-weight:800}
h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:var(--shadow)}
label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(94,224,219,.15)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand);flex:0 0 auto;margin:2px 0 0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:13.5px;margin:14px 0;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#150912;box-shadow:0 12px 30px -12px rgba(94,224,219,.7)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.wa{background:#25D366;color:#062612;box-shadow:0 12px 30px -14px rgba(37,211,102,.8)}
.btn.sm{width:auto;padding:8px 14px;font-size:13.5px;border-radius:11px}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px}.row>*{flex:1}
.err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);color:#FECACA;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.okmsg{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:#A7F3D0;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.hidden{display:none!important}

/* ---------- Loyalty card ---------- */
.lcard{position:relative;aspect-ratio:1.586;border-radius:22px;padding:18px 20px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,#6B2C7A 0%,transparent 55%),radial-gradient(90% 120% at 0% 100%,#14535A 0%,transparent 60%),linear-gradient(135deg,#1F0E1C,#301730 55%,#3A1438);
  box-shadow:0 30px 60px -25px rgba(94,224,219,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
.lcard::before{content:"";position:absolute;inset:-40% -10% auto auto;width:70%;height:140%;transform:rotate(25deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
.lcard::after{content:"";position:absolute;left:-30px;bottom:-60px;width:220px;height:220px;border-radius:50%;
  border:28px solid rgba(94,224,219,.07)}
.lcard .top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.lcard .brand{font-family:'Inter','Cairo',sans-serif;font-weight:800;font-size:18px;letter-spacing:0;direction:ltr;display:flex;align-items:center;gap:9px}
.lcard .brand .bm{width:38px;height:38px;flex:0 0 38px;background:transparent;overflow:hidden;display:block}
.lcard .brand .bm img{width:38px;height:38px;display:block}
.lcard .brand span{display:block;font-size:9.5px;letter-spacing:4px;color:#F5C542;font-weight:700}
.lcard .tier{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);letter-spacing:.5px}
.lcard .mid{position:absolute;inset:auto 20px 16px 20px;display:flex;justify-content:space-between;align-items:flex-end;z-index:1;gap:10px}
.lcard .name{font-size:17px;font-weight:800;line-height:1.25;max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .mno{font-family:'Inter',monospace;letter-spacing:2px;font-size:13px;color:#FBCFE3;direction:ltr;text-align:right}
.lcard .pts{font-family:'Inter',sans-serif;font-size:30px;font-weight:800;line-height:1;direction:ltr}
.lcard .pts small{font-family:'Cairo';font-size:11px;font-weight:700;color:var(--muted);display:block;margin-top:4px;text-align:end}
.lcard .chipicon{position:absolute;top:58px;left:20px;width:42px;height:32px;border-radius:7px;z-index:1;
  background:linear-gradient(135deg,#F5D27A,#B8892E);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.lcard .chipicon::before{content:"";position:absolute;inset:7px 10px;border:1.5px solid rgba(0,0,0,.25);border-radius:4px}
.lcard .tag{position:absolute;top:66px;right:20px;font-family:'Inter';font-size:10.5px;color:rgba(255,255,255,.55);letter-spacing:1px;z-index:1;direction:ltr}
.qrbox{background:#fff;border-radius:16px;padding:14px;display:flex;justify-content:center;align-items:center;margin:0 auto;width:max-content}
.qrbox img,.qrbox canvas{display:block}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-family:'Inter',sans-serif;font-size:21px;font-weight:800}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}
.progress{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.reward{display:flex;gap:12px;align-items:center;border-radius:16px;padding:14px;background:linear-gradient(135deg,rgba(245,196,81,.18),rgba(245,196,81,.04));border:1px solid rgba(245,196,81,.35)}
.reward .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--gold);color:#3B2A00;flex:0 0 auto}
.bday{display:flex;gap:12px;align-items:center;margin:16px 0 4px;padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(236,72,153,.22),rgba(245,197,66,.22));border:1px solid rgba(245,197,66,.5)}
.bday.used{opacity:.75}
.bday-ic{font-size:34px;line-height:1}
.offer{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface);margin:10px 0}
.offer img{width:100%;max-height:220px;object-fit:cover;display:block}
.offer .b{padding:12px 14px}
.offer.focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(94,224,219,.2)}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;background:rgba(94,224,219,.14);color:var(--brand)}
.badge.gold{background:rgba(245,196,81,.15);color:var(--gold)}
.badge.red{background:rgba(248,113,113,.15);color:var(--bad)}
.badge.green{background:rgba(52,211,153,.15);color:var(--ok)}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:13.5px;padding:8px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--surface2);color:var(--text)}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px dashed var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .l{min-width:0}
.list .it .l div{font-weight:700;font-size:14px}
.list .it .l small{color:var(--muted);font-size:12px}
.pos{color:var(--ok);font-weight:800;font-family:'Inter';direction:ltr}
.neg{color:var(--bad);font-weight:800;font-family:'Inter';direction:ltr}
.empty{color:var(--muted);text-align:center;padding:18px 6px;font-size:13.5px}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--brand);animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.switch{position:relative;width:48px;height:28px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.15);transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(-20px)}
[dir=ltr] .switch input:checked+span::after{transform:translateX(20px)}
details.howto summary{cursor:pointer;font-weight:700}
.fab-wa{position:fixed;bottom:18px;inset-inline-start:18px;width:56px;height:56px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(37,211,102,.7);z-index:20}
.fab-wa svg{width:30px;height:30px;color:#fff}
</style>

<style>
body.admin{--bg:#F3F5FA;--bg2:#FFFFFF;--surface:#FFFFFF;--surface2:#EEF2FA;--line:#E2E7F0;--text:#211020;--muted:#937189;
  --brand:#1BA8A2;--brand2:#D63F86;--shadow:0 6px 20px -12px rgba(36,16,32,.25);background-image:none;font-size:14.5px}
body.admin .btn{color:#fff}
body.admin .btn.ghost{color:var(--text);background:#fff}
body.admin .err{color:#991B1B;background:#FEF2F2;border-color:#FECACA}
body.admin .okmsg{color:#065F46;background:#ECFDF5;border-color:#A7F3D0}
body.admin .badge{background:#E0F2FE;color:#0369A1}
body.admin .badge.gold{background:#FEF3C7;color:#92400E}
body.admin .badge.red{background:#FEE2E2;color:#B91C1C}
body.admin .badge.green{background:#D1FAE5;color:#047857}
body.admin .badge.gray{background:#EEF2F7;color:#475569}
body.admin .pos{color:#059669}body.admin .neg{color:#DC2626}
.topbar{position:sticky;top:0;z-index:30;background:#211020;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar .logo small{color:#F5C542}
.topbar .who{font-size:12.5px;color:#CBD5E1;text-align:end}
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 58px)}
.nav{position:sticky;top:58px;flex:0 0 15.5rem;width:15.5rem;height:calc(100vh - 58px);overflow-y:auto;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:12px;scrollbar-width:thin}
.nav button{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#334155;font:inherit;font-weight:700;font-size:14px;padding:8px 10px;border-radius:10px;cursor:pointer;text-align:start}
.nav button:hover{background:#F1F3F6;color:var(--text)}
.nav .nav-ic{font-style:normal;width:32px;height:32px;flex:0 0 32px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;font-size:16px;background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c)}
.nav button.on{background:#E0F7FA;color:#178F8A}
.nav button.on .nav-ic{background:var(--c);color:#fff}
.nav button.on::before{content:"";position:absolute;right:-12px;top:8px;bottom:8px;width:4px;border-radius:4px 0 0 4px;background:#1BA8A2}
.shell .main{flex:1;min-width:0}
@media (max-width:900px), (pointer:coarse) and (max-width:1100px){
  .nav{flex-basis:84px;width:84px;padding:8px 5px;gap:3px}
  .nav button{flex-direction:column;gap:3px;padding:8px 2px;text-align:center;font-size:10.5px;line-height:1.25;justify-content:center}
  .nav button span{white-space:normal;word-break:break-word}
  .nav .nav-ic{width:30px;height:30px;flex-basis:30px;font-size:17px}
  .nav button.on::before{right:-5px}
  .shell .main{padding:12px 10px}
  .shell .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .shell .kpi{padding:10px}
  .shell .kpi b{font-size:20px}
}
.main{max-width:1180px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.kpi-go{cursor:pointer;position:relative;transition:transform .12s,border-color .12s}
.kpi-go:hover,.kpi-go:active{border-color:#1BA8A2;transform:translateY(-1px)}
.kpi-arrow{font-style:normal;color:#1BA8A2;font-weight:800;font-size:18px;position:absolute;left:12px;top:8px}

.h-go{cursor:pointer}
.rep-ranges{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:inherit}
.chip.on{background:#2563EB;border-color:#2563EB;color:#fff}
.bars{display:flex;flex-direction:column;gap:7px;max-height:420px;overflow:auto}
.bar-row{display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:8px;font-size:12.5px}

.bar-t i{display:block;height:100%;background:linear-gradient(90deg,#2563EB,#5EE0DB);border-radius:6px}
.bar-v{font-family:'Inter',sans-serif;font-size:12.5px;white-space:nowrap}
.backbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.rep-card:hover,.rep-card:active{border-color:#2563EB}
.rep-card i{font-style:normal;font-size:24px}.rep-card b{font-size:15px}.rep-card span{font-size:12.5px;color:var(--muted)}
.tbl th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
.tbl tr.tot td{background:#F8FAFC;border-top:2px solid var(--line)}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi b{display:block;font-family:'Inter',sans-serif;font-size:24px;font-weight:800;margin-top:2px}
.two{grid-template-columns:1fr}
@media(min-width:900px){.two{grid-template-columns:1fr 1fr}.sales-grid{grid-template-columns:1.1fr .9fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;color:var(--muted);text-align:start;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 6px;border-bottom:1px solid #EEF1F6;vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#F8FAFF}
.tblwrap{overflow-x:auto;margin:0 -4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;flex:1;min-width:160px}
.modal{position:fixed;inset:0;background:rgba(33,16,32,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}

@media(min-width:760px){.modal .box{border-radius:20px}}
.modal .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.x{border:0;background:#E2E8F0;border-radius:10px;width:34px;height:34px;font-size:18px;cursor:pointer}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#211020;color:#fff;padding:12px 18px;border-radius:12px;z-index:90;font-weight:700;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);max-width:92vw}
.toast.bad{background:#B91C1C}
.cust-chip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#211020,#1E1B4B);color:#fff}
.cust-chip b{font-size:16px}.cust-chip .p{font-family:'Inter';font-size:26px;font-weight:800}

.quote .r{display:flex;justify-content:space-between;padding:3px 0}
.quote .r.big{font-size:17px;font-weight:800;border-top:1px solid #E2E8F0;margin-top:6px;padding-top:8px}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px}
.perm-grid .check{margin:6px 0}
.setgroup h3{margin-top:18px;color:var(--brand)}
.setrow{display:grid;grid-template-columns:1fr;gap:4px;padding:10px 0;border-bottom:1px solid #EEF1F6}
@media(min-width:760px){.setrow{grid-template-columns:320px 1fr}}
.setrow label{margin:0}
.poster{background:linear-gradient(160deg,#1F0E1C,#3A1438);color:#fff;border-radius:24px;padding:28px;text-align:center;max-width:420px;margin:0 auto}
.poster h1{color:#fff;font-family:'Inter';letter-spacing:2px}
.recip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EEF1F6}
.ws-bar{padding:8px 0;border-bottom:1px solid #EEF1F6}
.ws-all{margin:0;display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.ws-note{margin-top:6px;padding:8px 10px;border-radius:10px;background:#FFF8E6;font-size:13px}
.ws-row{justify-content:flex-start;cursor:pointer;margin:0;font-weight:400;font-size:inherit}
.ws-row input,.ws-all input{width:20px;height:20px;flex:0 0 20px;margin:0}
.ws-foot{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff;border:2px solid #25D366;border-radius:14px;padding:10px 12px;margin-bottom:12px;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.ws-foot .btn[disabled]{opacity:.5;pointer-events:none}
.recip .msg{font-size:12px;color:var(--muted);white-space:pre-line;max-height:3.2em;overflow:hidden}
#scanVideo{width:100%;border-radius:14px;background:#000;max-height:320px}
@media print{.topbar,.nav,.noprint{display:none!important}.shell{display:block}.main{padding:0}body.admin{background:#fff}}

    r[fn].apply(r, args);

function esc(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {

/* ---------------- مسح QR بالكاميرا ---------------- */
var SCAN = { stream: null, raf: 0 };
function startScan(box, onText) {
  stopScan();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { box.innerHTML = '<div class="err">الكاميرا غير مدعومة في هذا المتصفح. استخدم البحث برقم الموبايل أو قارئ باركود.</div>'; return; }
  box.innerHTML = '<video id="scanVideo" playsinline muted></video><div class="toolbar" style="margin-top:6px"><span class="small muted" style="flex:1">وجّه الكاميرا إلى QR الكارت</span><button class="btn ghost sm" id="scanStop" type="button">إيقاف</button></div>';
  $('#scanStop').onclick = function () { stopScan(); box.innerHTML = ''; };
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function (stream) {
    SCAN.stream = stream;
    var video = $('#scanVideo'); video.srcObject = stream; video.play();
    var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
    var detector = ('BarcodeDetector' in window) ? new window.BarcodeDetector({ formats: ['qr_code'] }) : null;
    var tick = function () {
      if (!SCAN.stream) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        if (detector) {
          detector.detect(video).then(function (codes) { if (codes.length && SCAN.stream) { stopScan(); box.innerHTML = ''; onText(codes[0].rawValue); } }).catch(function () { });
        } else if (window.jsQR) {
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var code = window.jsQR(img.data, img.width, img.height);
          if (code && code.data) { stopScan(); box.innerHTML = ''; onText(code.data); return; }
        }
      }
      SCAN.raf = requestAnimationFrame(tick);
    };
    tick();
  }).catch(function () {
    box.innerHTML = '<div class="err">تعذر فتح الكاميرا (قد تكون صلاحية الكاميرا مرفوضة أو غير متاحة داخل صفحات Google). بدائل: اكتب رقم الموبايل أو رقم العضوية، أو استخدم قارئ باركود USB، أو امسح QR بكاميرا الموبايل وانسخ الرابط هنا.</div>';
  });
}
function stopScan() {
  if (SCAN.stream) { SCAN.stream.getTracks().forEach(function (t) { t.stop(); }); }
  SCAN.stream = null; cancelAnimationFrame(SCAN.raf);
}

      x.wa_sent_at = 'pending';
      var a = $('[data-bsend="' + i + '"]');
      setTimeout(function () { if (a && x.wa_sent_at) { a.style.opacity = '.5'; a.style.pointerEvents = 'none'; } updateNext(); }, 300);
      call('bdayMark', { customer_id: x.customer_id }, true).then(function (res) {
        x.wa_sent_at = res.wa_sent_at;
        $('[data-bst="' + i + '"]').textContent = '✓ التهنئة اتبعتت';
        $('#bdPend').textContent = fmtNum(pending().length);
        updateNext();
      }).catch(function (e) {

        if (!/قبل كده/.test(e.message)) { x.wa_sent_at = null; if (a) { a.style.opacity = ''; a.style.pointerEvents = ''; } }
        updateNext();
      });
    };
    var updateNext = function () {
      var btn = $('#bdNext'); if (!btn) return;
      var list = cur.filter(function (x) { return x.wa_opt_in; }), left = pending();
      if (!left.length) {
        btn.innerHTML = list.length ? '✓ اتبعتت تهنئة لكل الموافقين' : 'مفيش حد منهم موافق على رسائل واتساب';
        btn.removeAttribute('href'); btn.style.opacity = '.6'; btn.style.pointerEvents = 'none';
        $('#bdNextInfo').textContent = ''; return;
      }
      var x = left[0], i = cur.indexOf(x);
      btn.href = x.link; btn.dataset.idx = i; btn.style.opacity = ''; btn.style.pointerEvents = '';
      btn.innerHTML = ICONS.wa + ' ابعت تهنئة لـ ' + esc(x.name) + ' (' + (list.length - left.length + 1) + ' من ' + list.length + ')';
      $('#bdNextInfo').textContent = 'فاضل ' + left.length;
    };
    if ($('#bdNext')) $('#bdNext').addEventListener('click', function () { var i = Number(this.dataset.idx); if (i >= 0) mark(i); });
    $all('[data-bsend]', v).forEach(function (a) { a.addEventListener('click', function () { mark(Number(a.dataset.bsend)); }); });
    updateNext();
  }).catch(function (e) { v.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}

/* الخطوة 1: اختيار المستلمين. الفلاتر بتوصلك للعملاء، والعلامة (✓) هي اللي بتحدد مين هيتبعتله */
var WA_PAGE = 50;
function waSelectStep(id, r, keep) {
  var box = $('#waRes'), all = r.recipients;
  var sel = (keep && keep.sel) || {}, f = (keep && keep.f) || { q: '', tier: '', cf: 'all', lp: '', days: 30 }, page = (keep && keep.page) || 0;
  var hasTier = all.some(function (x) { return x.tier !== undefined; }), hasLp = all.some(function (x) { return x.last_purchase_at !== undefined; });
  var tiers = []; all.forEach(function (x) { if (x.tier && tiers.indexOf(x.tier) < 0) tiers.push(x.tier); });
  var day = 86400000;
  var match = function (x) {
    if (f.q) {
      var q = f.q.toLowerCase(), qd = f.q.replace(/\D/g, '');
      if (!(String(x.name).toLowerCase().indexOf(q) >= 0 || x.member_no === f.q || (qd.length >= 3 && String(x.phone).indexOf(qd) >= 0))) return false;
    }
    if (f.tier && x.tier !== f.tier) return false;
    if (f.cf !== 'all' && !custMatch(x, f.cf)) return false;
    if (f.lp) {
      var n = Math.max(0, Number(f.days) || 0), t = x.last_purchase_at ? new Date(x.last_purchase_at).getTime() : 0;
      if (f.lp === 'never' && t) return false;
      if (f.lp === 'within' && !(t && Date.now() - t <= n * day)) return false;
      if (f.lp === 'over' && !(t && Date.now() - t > n * day)) return false;
    }
    return true;
  };
  var canPick = function (x) { return !(r.community && x.sent_at); };
  var selCount = function () { return all.filter(function (x) { return sel[x.customer_id]; }).length; };
  var sent = all.filter(function (x) { return x.sent_at; }).length;

  box.innerHTML = '<div class="grid kpis" style="margin-bottom:10px">' +
    '<div class="kpi"><span>' + (r.community ? 'العملاء الموافقين' : 'مستهدفون وموافقون') + '</span><b>' + fmtNum(all.length) + '</b></div><div class="kpi"><span>' + (r.community ? 'اتبعتلهم الدعوة قبل كده' : 'اتبعتلهم العرض ده قبل كده') + '</span><b>' + fmtNum(sent) + '</b></div>' +
    '<div class="kpi"><span>مستبعدون (بدون موافقة)</span><b>' + fmtNum(r.excluded.no_consent) + '</b></div><div class="kpi"><span>مرسل اليوم / الحد المقترح</span><b>' + r.sent_today + ' / ' + r.daily_soft_limit + '</b></div></div>' +
    (!r.offer.live ? '<div class="err">تنبيه: العرض غير ساري حالياً (مجدول أو منتهي).</div>' : '') +
    (all.length ? '<div class="card" style="margin-bottom:12px"><h2>1) اختار العملاء اللي هيتبعتلهم</h2>' +
      '<p class="small muted" style="margin-top:-4px">الفلاتر بتوصلك للعملاء بس. اللي عليه علامة ✓ هو بس اللي هيتبعتله.</p>' +
      '<div class="toolbar"><input id="wsQ" placeholder="ابحث بالاسم أو الموبايل أو رقم العضوية">' +
      '<select id="wsCF" style="flex:0 0 180px">' + CUST_FILTERS.filter(function (x) { return ['all', 'new', 'inactive', 'points'].indexOf(x[0]) >= 0; }).map(function (x) { return '<option value="' + x[0] + '">' + x[1] + '</option>'; }).join('') + '</select>' +

      (hasLp ? '<div class="toolbar"><select id="wsLp" style="flex:0 0 230px"><option value="">آخر شراء: أي وقت</option><option value="within">اشترى خلال آخر … يوم</option><option value="over">مشتراش من … يوم أو أكتر</option><option value="never">عمره ما اشترى</option></select>' +
        '<input type="number" min="0" inputmode="numeric" id="wsDays" style="flex:0 0 110px" placeholder="عدد الأيام"></div>' : '') +
      '<div id="wsBar" class="ws-bar"></div><div id="wsList"></div><div id="wsPager" class="toolbar" style="justify-content:center;margin-top:8px"></div></div>' +
      '<div class="ws-foot"><b id="wsSelN"></b><button class="btn wa" id="wsReview" type="button">مراجعة قبل الإرسال</button></div>'
      : '<div class="empty">لا يوجد عملاء مستهدفون وموافقون لهذا العرض</div>');
  if (!all.length) return;

  $('#wsQ').value = f.q; $('#wsCF').value = f.cf; if ($('#wsTier')) $('#wsTier').value = f.tier;
  if ($('#wsLp')) { $('#wsLp').value = f.lp; $('#wsDays').value = f.days; $('#wsDays').style.display = f.lp === 'within' || f.lp === 'over' ? '' : 'none'; }

  var render = function () {
    var rows = all.filter(match), pages = Math.max(1, Math.ceil(rows.length / WA_PAGE));
    if (page >= pages) page = pages - 1;
    var cur = rows.slice(page * WA_PAGE, page * WA_PAGE + WA_PAGE);
    var curP = cur.filter(canPick), rowsP = rows.filter(canPick);
    var pageAll = curP.length && curP.every(function (x) { return sel[x.customer_id]; });
    var rowsAll = rowsP.length && rowsP.every(function (x) { return sel[x.customer_id]; });
    var rowsSel = rows.filter(function (x) { return sel[x.customer_id]; }).length;
    $('#wsBar').innerHTML = '<label class="ws-all"><input type="checkbox" id="wsPageAll"' + (pageAll ? ' checked' : '') + (curP.length ? '' : ' disabled') + '> Select All – ' +
      (pages > 1 ? 'الصفحة دي بس (' + fmtNum(curP.length) + ')' : 'كل الظاهرين (' + fmtNum(curP.length) + ')') + '</label>' +
      '<div class="small muted">الظاهرين بالفلتر: ' + fmtNum(rows.length) + ' عميل' + (rowsSel ? ' · منهم محددين: ' + fmtNum(rowsSel) : '') + '</div>' +
      (pages > 1 && rowsP.length ? '<div class="ws-note">' + (rowsAll ? 'كل الـ ' + fmtNum(rowsP.length) + ' عميل المطابقين للفلتر محددين (في كل الصفحات).' :

      '<div class="toolbar" style="margin:6px 0 0">' + (rowsSel ? '<button class="btn ghost sm" type="button" id="wsRowsNone">شيل التحديد من الظاهرين بالفلتر</button>' : '') +
      (selCount() ? '<button class="btn ghost sm" type="button" id="wsNone">شيل التحديد من الكل</button>' : '') + '</div>';
    $('#wsList').innerHTML = cur.length ? cur.map(function (x) {

        (x.last_purchase_at !== undefined ? (x.last_purchase_at ? 'آخر شراء ' + d(x.last_purchase_at) : 'عمره ما اشترى') : '') +
        (x.sent_at ? ' · <span style="color:#16A34A">✓ ' + (r.community ? 'اتبعتله الدعوة قبل كده' : 'اتبعتله العرض ده قبل كده') + '</span>' : '') + '</div></div></label>';

    var n = selCount();
    $('#wsSelN').textContent = 'Selected: ' + fmtNum(n) + ' Customers – المحددين للإرسال: ' + fmtNum(n) + ' عميل';
    $('#wsReview').disabled = !n;

    $all('.ws-c', box).forEach(function (c) { c.onchange = function () { if (c.checked) sel[c.dataset.id] = true; else delete sel[c.dataset.id]; render(); }; });
    $('#wsPageAll').onchange = function () { var on = this.checked; curP.forEach(function (x) { if (on) sel[x.customer_id] = true; else delete sel[x.customer_id]; }); render(); };
    if ($('#wsRowsAll')) $('#wsRowsAll').onclick = function () { rowsP.forEach(function (x) { sel[x.customer_id] = true; }); render(); };
    if ($('#wsRowsNone')) $('#wsRowsNone').onclick = function () { rows.forEach(function (x) { delete sel[x.customer_id]; }); render(); };
    if ($('#wsNone')) $('#wsNone').onclick = function () { Object.keys(sel).forEach(function (k) { delete sel[k]; }); render(); };
    if ($('#wsPrev')) $('#wsPrev').onclick = function () { page--; render(); };
    if ($('#wsNext')) $('#wsNext').onclick = function () { page++; render(); };
  };
  var t; $('#wsQ').addEventListener('input', function () { clearTimeout(t); t = setTimeout(function () { f.q = $('#wsQ').value.trim(); page = 0; render(); }, 250); });
  $('#wsCF').onchange = function () { f.cf = this.value; page = 0; render(); };
  if ($('#wsTier')) $('#wsTier').onchange = function () { f.tier = this.value; page = 0; render(); };
  if ($('#wsLp')) {

    $('#wsDays').addEventListener('input', function () { f.days = this.value; page = 0; render(); });
  }
  $('#wsReview').onclick = function () {

    var x = list[i];
    x.sent_at = x.sent_at || 'pending';
    return call('waMark', { customer_id: x.customer_id, offer_id: id, status: 'sent', message: x.message, message_type: r.community ? 'community' : 'offer' }).then(function () {
      x.sent_at = new Date().toISOString();
      $('[data-st="' + i + '"]').textContent = '✓ تم تسجيل الإرسال';
      $('[data-undo="' + i + '"]').style.display = '';
      updateNext();
    }).catch(function (e) { x.sent_at = null; updateNext(); toast(e.message, true); });
  };
  var nextIdx = function () { for (var i = 0; i < list.length; i++) if (!list[i].sent_at) return i; return -1; };
  var updateNext = function () {
    var btn = $('#waNext'); if (!btn) return;
    var i = nextIdx(), total = list.length, n = done();
    if (i < 0) { btn.innerHTML = '✓ تم الإرسال لكل المحددين'; btn.removeAttribute('href'); btn.style.opacity = '.6'; btn.style.pointerEvents = 'none'; $('#waNextInfo').textContent = 'اتبعت لـ ' + n + ' من ' + total + ' عميل محدد'; return; }
    var x = list[i];
    btn.href = x.link; btn.dataset.idx = i; btn.style.opacity = ''; btn.style.pointerEvents = '';
    btn.innerHTML = ICONS.wa + ' ابعت لـ ' + esc(x.name) + ' (' + (n + 1) + ' من ' + total + ')';
    $('#waNextInfo').textContent = 'فاضل ' + (total - n) + ' عميل من المحددين';
  };
  $('#waNext').addEventListener('click', function () { var i = Number(this.dataset.idx); if (i >= 0 && !list[i].sent_at) markSent(i); });
  $('#wsBack').onclick = function () { waSelectStep(id, r, keep); };
  if (!r.community) {
    var of = WA_OFFERS[id] || {}, ro = r.offer || {};
    var bcTitle = ro.title || of.title || '', bcDesc = ro.description || of.description || '';
    var bcEnd = ro.end_date || (of.end_date ? d(of.end_date) : '');
    var bcBase = r.base_url || BOOT.base || (location.origin + location.pathname), bcShop = r.shop || PS.shop_name_ar || PS.shop_name || '', bcPhone = r.shop_phone || PS.shop_phone || '';
    $('#waBc').value = '🎁 ' + bcTitle + (bcDesc ? '\n' + bcDesc : '') + (bcEnd ? '\n\n⏳ العرض ساري حتى ' + bcEnd : '') +
      '\n\nسجّل أو افتح كارتك واعرف رصيد نقاطك:\n' + bcBase + '\n\n' + bcShop + (bcPhone ? ' – ' + bcPhone : '') + '\nلإيقاف العروض ابعت كلمة "إيقاف".';
    $('#waBcCopy').onclick = function () { copyText($('#waBc').value).then(function () { toast('تم النسخ ✓'); }); };
  }
  updateNext();
  $all('[data-send]', box).forEach(function (a) { a.addEventListener('click', function () { markSent(Number(a.dataset.send)); }); });
  $all('[data-undo]', box).forEach(function (b) {
    b.onclick = function () {
      var x = list[b.dataset.undo];
      call('waMark', { customer_id: x.customer_id, offer_id: id, status: 'cancelled', message_type: r.community ? 'community' : 'offer' }).then(function () {
        x.sent_at = null; $('[data-st="' + b.dataset.undo + '"]').textContent = ''; b.style.display = 'none';
        updateNext();
      }).catch(function (e) { toast(e.message, true); });
    };
  });
}

      '<p class="small muted">كل قواعد البرنامج هنا قابلة للتعديل بدون مبرمج. التعديل يسري على العمليات الجديدة فقط، والعمليات السابقة تحتفظ بالقواعد التي سُجلت بها.</p><div id="stErr"></div>';

        else input = '<input data-key="' + esc(s.key) + '" value="' + esc(s.value) + '"' + (s.type === 'number' ? ' inputmode="decimal" style="direction:ltr;max-width:200px"' : '') + '>';

      '<div class="tblwrap"><table class="tbl" id="tierTbl"><tr><th>المعرف</th><th>الاسم عربي</th><th>الاسم إنجليزي</th><th>من نقاط</th><th>اللون</th><th>مفعل</th></tr>' +
      r.tiers.map(tierRow).join('') + '</table></div><div class="toolbar" style="margin-top:8px"><button class="btn ghost sm" id="tierAdd" type="button">+ مستوى</button><button class="btn sm" id="tierSave" type="button">حفظ المستويات</button></div></div>';
    html += '<div class="card" style="margin-top:12px"><h2>الفروع</h2>' + r.branches.map(function (b) { return '<div class="recip"><b>' + esc(b.name) + '</b><span class="small muted">' + esc(b.branch_id) + ' · ' + esc(b.phone) + '</span></div>'; }).join('') +
      '<div class="row"><input id="brName" placeholder="اسم فرع جديد"><input id="brPhone" placeholder="رقم الفرع"></div><div style="height:8px"></div><button class="btn ghost sm" id="brAdd" type="button">+ إضافة فرع</button></div>';
    html += '<div class="card" style="margin-top:12px"><h2>مراجعة الأرصدة</h2><p class="small muted">يعيد حساب رصيد كل عميل من سجل الحركات ويصحح أي اختلاف في عمود الرصيد السريع.</p><button class="btn ghost sm" id="recalcBtn" type="button">إعادة حساب كل الأرصدة</button></div>';
    v.innerHTML = html;
    $('#stSave').onclick = function () {
      var values = {};
      $all('[data-key]', v).forEach(function (el) { values[el.dataset.key] = el.type === 'checkbox' ? (el.checked ? 'true' : 'false') : el.value; });
      busy($('#stSave'), true);
      call('saveSettings', { values: values }, true).then(function (x) { toast(x.changed ? 'تم حفظ ' + x.changed + ' تعديل ✓' : 'لا توجد تغييرات'); $('#stErr').innerHTML = ''; return call('me').then(function (m) { PS = m.settings; }); })
        .catch(function (e) { $('#stErr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; toast(e.message, true); }).then(function () { busy($('#stSave'), false); });
    };
    $('#tierAdd').onclick = function () { var tr = document.createElement('tr'); tr.innerHTML = tierRow({ tier_id: '', name_ar: '', name_en: '', min_lifetime_points: 0, color: '#C0C7D1', active: true }, true); $('#tierTbl tbody') ? $('#tierTbl tbody').appendChild(tr) : $('#tierTbl').appendChild(tr); };

        return { tier_id: g('tier_id').value, name_ar: g('name_ar').value, name_en: g('name_en').value, min_lifetime_points: g('min').value, color: g('color').value, active: g('active').checked, sort: i + 1 };

    $('#recalcBtn').onclick = function () { busy($('#recalcBtn'), true); call('recalc').then(function (x) { toast('تمت المراجعة. تم تصحيح ' + x.fixed + ' رصيد'); }).catch(function (e) { toast(e.message, true); }).then(function () { busy($('#recalcBtn'), false); }); };
  }).catch(function (e) { v.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}
function tierRow(t, inner) {

function viewUsers(v) {
  call('listUsers').then(function (r) {

          (u.active ? badge('نشط', 'green') : badge('موقوف', 'red')) + (u.locked ? ' ' + badge('مقفول مؤقتاً', 'gold') : '') + (u.must_change_password ? ' ' + badge('كلمة مرور مؤقتة', 'gray') : '') + '</td>' +
          '<td style="white-space:nowrap"><button class="btn ghost sm" data-ue="' + esc(u.user_id) + '" type="button">تعديل</button> <button class="btn ghost sm" data-ur="' + esc(u.user_id) + '" type="button">كلمة مرور جديدة</button></td></tr>';
      }).join('') + '</table></div></div>';

        }).catch(function (e) { toast(e.message, true); });

function userForm(r, u) {

    '<div class="row"><div><label>اسم المستخدم (إنجليزي) *</label><input id="ufUser" value="' + esc(u.username) + '" style="direction:ltr"></div><div><label>الموبايل</label><input id="ufPhone" value="' + esc(u.phone) + '" style="direction:ltr"></div></div>' +
    '<div class="row"><div><label>الدور</label><select id="ufRole">' + Object.keys(r.roles).map(function (k) { return '<option value="' + k + '"' + (k === u.role ? ' selected' : '') + '>' + { owner: 'المالك (كل الصلاحيات)', manager: 'مدير', cashier: 'كاشير', marketing: 'تسويق' }[k] + '</option>'; }).join('') + '</select></div>' +
    '<div><label>الفرع</label><select id="ufBranch">' + r.branches.map(function (b) { return '<option value="' + esc(b.branch_id) + '"' + (b.branch_id === u.branch_id ? ' selected' : '') + '>' + esc(b.name) + '</option>'; }).join('') + '</select></div></div>' +
    '<label>الصلاحيات</label><div class="perm-grid">' + Object.keys(r.permissions).map(function (p) { return '<label class="check"><input type="checkbox" data-perm="' + p + '"' + (u.permissions.indexOf(p) >= 0 ? ' checked' : '') + '><span>' + esc(r.permissions[p]) + '</span></label>'; }).join('') + '</div>' +
    '<label class="check"><input type="checkbox" id="ufActive"' + (u.active ? ' checked' : '') + '><span>الحساب نشط</span></label>' +
    '<div id="ufErr"></div><button class="btn" id="ufSave" type="button">حفظ</button>');
  $('#ufRole').onchange = function () { var pr = r.roles[$('#ufRole').value] || []; $all('[data-perm]').forEach(function (cb) { cb.checked = pr.indexOf(cb.dataset.perm) >= 0; }); };

    busy($('#ufSave'), true);

        if (x.temp_password) body.innerHTML = '<div class="okmsg">تم إنشاء الحساب ✓</div><p>كلمة المرور المؤقتة (سيُطلب تغييرها عند أول دخول):</p><div class="quote" style="font-family:Inter;font-size:20px;text-align:center;direction:ltr" id="tmpPw">' + esc(x.temp_password) + '</div><p class="small muted">رابط الدخول هو نفس رابط لوحة الإدارة الحالي. أرسله للموظف بشكل خاص.</p>';
        else { closeModal(); toast('تم الحفظ ✓'); }
        go('users');
      }).catch(function (e) { $('#ufErr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; busy($('#ufSave'), false); });
  };
}

    '<div class="toolbar"><button class="btn sm" id="qrPrint" type="button">طباعة</button><button class="btn ghost sm" id="qrDl" type="button">تحميل صورة QR</button><button class="btn ghost sm" id="qrCopy" type="button">نسخ رابط التسجيل</button></div>' +
    '<div class="small" style="direction:ltr;word-break:break-all;color:var(--muted)">' + esc(url) + '</div></div>' +
    '<div class="poster" style="margin-top:14px"><div style="display:flex;justify-content:center">' + logoHtml(PS) + '</div><h1 style="margin:14px 0 0">' + esc(PS.program_name) + '</h1><div style="color:#7DD3FC;font-family:Inter;letter-spacing:1px">' + esc(PS.tagline) + '</div>' +
    '<p style="font-size:18px;font-weight:800;margin:14px 0 4px">امسح الكود واحصل على كارت الولاء مجاناً</p><p style="color:#CBD5E1;margin:0 0 14px">كل ' + esc(PS.amount_per_point) + ' ' + esc(PS.currency) + ' = نقطة · ' + esc(PS.redeem_points_required) + ' نقطة = خصم ' + esc(PS.discount_percent) + '%</p>' +
    '<div class="qrbox" id="shopQr"></div><p style="color:#CBD5E1;margin-top:14px">بدون تحميل أي تطبيق · ' + esc(PS.shop_phone) + '</p></div>';
  renderQR($('#shopQr'), url, 240);
  $('#qrPrint').onclick = function () { window.print(); };
  $('#qrCopy').onclick = function () { copyText(url).then(function () { toast('تم النسخ'); }); };
  $('#qrDl').onclick = function () {
    var img = $('#shopQr img') || $('#shopQr canvas');
    var src = img && (img.tagName === 'CANVAS' ? img.toDataURL('image/png') : img.src);
    if (!src) return toast('تعذر التحميل', true);
    var a = document.createElement('a'); a.href = src; a.download = 'cake-shop-qr.png'; document.body.appendChild(a); a.click(); a.remove();
  };
}
