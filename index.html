<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170B14">
<title>Cake Shop Dessert Cafe</title>
<meta property="og:title" content="Cake Shop Dessert Cafe">
<meta property="og:description" content="كارت الولاء بتاعك من كيك شوب 🍩">
<meta property="og:image" content="https://mohammedelgmahy-netizen.github.io/cake-shop-club/share-logo.png">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{margin:0;height:100%;background:#170B14;color:#D3B3C6;font-family:system-ui,Tahoma,sans-serif}
.l{height:100%;display:grid;place-items:center;text-align:center}.s{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#5EE0DB;animation:r .8s linear infinite;margin:0 auto 12px}
@keyframes r{to{transform:rotate(360deg)}}</style>
</head><body><div class="l"><div><div class="s"></div><div id="m">Cake Shop Dessert Cafe</div></div></div>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); window.__mcInstallPrompt = e; });
(function(){
  var FN = "https://lhamdnaxioxqptkylvkg.supabase.co/functions/v1/cakeshop?forceFunctionRegion=ap-south-1";
  var params = {}; new URLSearchParams(location.search).forEach(function(v,k){ params[k]=v; });
  var base = location.href.split('#')[0].split('?')[0];
  function fail(){ document.getElementById('m').innerHTML = 'تعذر الاتصال. تأكد من الإنترنت ثم <a href="" style="color:#5EE0DB">أعد المحاولة</a>'; }
  var V = {"Register":"375c7dab69","Card":"6f6faa0600","Unsub":"463c3be20d","Message":"4a901c5b01","Admin":"739c6286a7"};
  var getPage = function(n){ return fetch(base.replace(/[^/]*$/, '') + 'pages/' + n + '.html?v=' + V[n]).then(function(r){ if (!r.ok) throw new Error('page'); return r.text(); }); };
  var guess = params.p === 'admin' ? 'Admin' : params.p === 'unsub' ? 'Unsub' : params.t ? 'Card' : 'Register';
  var early = getPage(guess); early.catch(function(){});
  window.MC_FUNCTION_URL = FN;
  window.__mcPost = function(body){
  var url = window.MC_FUNCTION_URL;
  var send = function(ct){ var c = window.AbortController ? new AbortController() : null; var t = c ? setTimeout(function(){ c.abort(); }, window.__mcTimeout || (body.length > 200000 ? 120000 : 30000)) : 0; return fetch(url, { method: 'POST', headers: {'Content-Type': ct}, body: body, signal: c ? c.signal : undefined }).then(function(r){ clearTimeout(t); if (r.status >= 400 && r.status !== 500) throw new Error('ct'); return r.json(); }, function(e){ clearTimeout(t); throw e; }); };
  if (window.__mcJson) return send('application/json');
  return send('text/plain;charset=UTF-8').catch(function(e){ if (e && e.name === 'AbortError') throw e; window.__mcJson = true; return send('application/json'); });
};
  window.__mcPost(JSON.stringify({ fn: 'page', args: [params] }))
    .then(function(j){
      if (!j.result) return fail();
      window.__MC_BOOT__ = j.result.boot || {};
      return (j.result.page === guess ? early : getPage(j.result.page)).then(function(html){
        document.open(); document.write(html); document.close();
        document.title = j.result.title || 'Cake Shop Dessert Cafe';
      });
    }).catch(fail);
})();
</script></body></html>
